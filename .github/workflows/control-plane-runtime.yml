name: Central Control Plane Runtime

# Production central dispatch/admission entry point.
# Source of truth for this workflow's logic is the audited copy at
# engineering/.github/workflows/control-plane-runtime.yml (non-executing nested
# source). This root copy only differs in script paths (engineering/scripts/)
# and the explicit ASTRA_TARGET_REPOSITORY selection. Both files are covered by
# the audited-runtime attestation in control_plane.py (RUNTIME_PATHS).
#
# Installed disabled: activation.json has runtime_enabled=false and
# user_activation_approval=NOT_APPROVED, so every dispatch operation fails
# closed until separate User authorization plus a bounded canary decision.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "preflight or dispatch"
        required: true
        type: choice
        options:
          - preflight
          - dispatch
      target_repository:
        description: "Consumer product repository profile (projects.json)"
        required: true
        type: choice
        options:
          - BeautifulMind-JT/kix-protocol
          - BeautifulMind-JT/ZARI
          - BeautifulMind-JT/film-unit-mv-studio
          - BeautifulMind-JT/maeum-gyeol
      issue_number:
        description: "Canonical GitHub task issue number (required for dispatch)"
        required: false
        type: string
      expected_task_id:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_task_revision:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_builder_id:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_issue_body_sha256:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_attempt_id:
        description: "Explicit retry: next attempt number from the control record; empty for the first attempt"
        required: false
        type: string
      builder_id:
        description: "Builder for preflight"
        required: false
        default: "ALL"
        type: choice
        options:
          - ALL
          - DEVIN
          - GROK_BUILD
          - GLM
          - CURSOR

permissions:
  contents: read

concurrency:
  group: astra-control-${{ github.repository }}-${{ inputs.target_repository }}-${{ inputs.issue_number || 'preflight' }}
  cancel-in-progress: false

jobs:
  control:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, astra-control-plane]
    timeout-minutes: 15
    env:
      ASTRA_TARGET_REPOSITORY: ${{ inputs.target_repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
      EXPECTED_TASK_REVISION: ${{ inputs.expected_task_revision }}
      EXPECTED_BUILDER_ID: ${{ inputs.expected_builder_id }}
      EXPECTED_ISSUE_BODY_SHA256: ${{ inputs.expected_issue_body_sha256 }}
      EXPECTED_ATTEMPT_ID: ${{ inputs.expected_attempt_id }}
      PREFLIGHT_BUILDER: ${{ inputs.builder_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repository contract
        run: python3 -I engineering/scripts/control_plane.py validate-repo

      - name: Host preflight
        if: ${{ inputs.operation == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_BUILDER" == "ALL" ]]; then
            python3 -I engineering/scripts/control_plane.py host-preflight
          else
            python3 -I engineering/scripts/control_plane.py host-preflight --builder-id "$PREFLIGHT_BUILDER"
          fi

      - name: Validate dispatch input
        if: ${{ inputs.operation == 'dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "issue_number must be a positive integer" >&2
            exit 2
          fi
          if [[ -n "$EXPECTED_ATTEMPT_ID" && ! "$EXPECTED_ATTEMPT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "expected_attempt_id must be empty or a positive integer" >&2
            exit 2
          fi

      - name: Prepare serialized dispatch
        id: prepare
        if: ${{ inputs.operation == 'dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: >-
          python3 -I engineering/scripts/control_plane.py prepare-dispatch
          --issue-number "$ISSUE_NUMBER"
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"

      - name: Launch through protected host admission
        if: ${{ inputs.operation == 'dispatch' && steps.prepare.outputs.launch_required == 'true' }}
        run: >-
          python3 -I engineering/scripts/control_plane.py launch-dispatch
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Finalize exact launch state
        if: ${{ always() && inputs.operation == 'dispatch' && steps.prepare.outputs.launch_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
          LAUNCH_REQUEST_ID: ${{ steps.prepare.outputs.launch_request_id }}
        run: >-
          python3 -I engineering/scripts/control_plane.py finalize-dispatch
          --issue-number "$ISSUE_NUMBER"
          --launch-request-id "$LAUNCH_REQUEST_ID"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

