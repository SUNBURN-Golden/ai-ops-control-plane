name: Central Control Plane Runtime

# Production central dispatch/admission entry point.
# Source of truth for this workflow's logic is the audited copy at
# engineering/.github/workflows/control-plane-runtime.yml (non-executing nested
# source). This root copy only differs in script paths (engineering/scripts/)
# and the explicit ASTRA_TARGET_REPOSITORY selection. Both files are covered by
# the audited-runtime attestation in control_plane.py (RUNTIME_PATHS).
#
# Installed disabled: activation.json has runtime_enabled=false and
# user_activation_approval=NOT_APPROVED, so every dispatch operation fails
# closed until separate User authorization plus a bounded canary decision.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "preflight, dispatch, or a program-mode operation (docs/PROGRAM_MODE.md)"
        required: true
        type: choice
        options:
          - preflight
          - dispatch
          - lanes
          - materialize
          - start
          - review
          - reap
          - merge-check
          - merge
          - astra-audit
          - astra-consult
          - quota-readiness
          - quota-resume
      target_repository:
        description: "Consumer product repository profile (projects.json)"
        required: true
        type: choice
        options:
          - BeautifulMind-JT/kix-protocol
          - BeautifulMind-JT/ZARI
          - BeautifulMind-JT/film-unit-mv-studio
          - BeautifulMind-JT/maeum-gyeol
          - BeautifulMind-JT/kix-commerce-apps
      issue_number:
        description: "Canonical GitHub task issue number (required for dispatch)"
        required: false
        type: string
      expected_task_id:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_task_revision:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_builder_id:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_issue_body_sha256:
        description: "Pinned dispatch authorization; mandatory for dispatch"
        required: false
        type: string
      expected_attempt_id:
        description: "Explicit retry: next attempt number from the control record; empty for the first attempt"
        required: false
        type: string
      program_args:
        description: "Program-mode JSON arguments (program, node, plan_commit, slot, launch_request_id, evidence, pr_number, head, question_comment_id)"
        required: false
        type: string
        default: "{}"
      builder_id:
        description: "Builder for preflight"
        required: false
        default: "ALL"
        type: choice
        options:
          - ALL
          - DEVIN
          - GROK_BUILD
          - GLM
          - CURSOR

permissions:
  contents: read

concurrency:
  group: astra-control-${{ github.repository }}-${{ inputs.target_repository }}-${{ inputs.issue_number || inputs.program_args || 'preflight' }}
  cancel-in-progress: false

jobs:
  control:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, astra-control-plane]
    timeout-minutes: ${{ inputs.operation == 'quota-resume' && 490 || contains(fromJSON('["astra-audit","astra-consult"]'), inputs.operation) && 245 || 15 }}
    env:
      ASTRA_TARGET_REPOSITORY: ${{ inputs.target_repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
      EXPECTED_TASK_REVISION: ${{ inputs.expected_task_revision }}
      EXPECTED_BUILDER_ID: ${{ inputs.expected_builder_id }}
      EXPECTED_ISSUE_BODY_SHA256: ${{ inputs.expected_issue_body_sha256 }}
      EXPECTED_ATTEMPT_ID: ${{ inputs.expected_attempt_id }}
      PREFLIGHT_BUILDER: ${{ inputs.builder_id }}
      PROGRAM_ARGS: ${{ inputs.program_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repository contract
        run: python3 -I engineering/scripts/control_plane.py validate-repo

      - name: Host preflight
        if: ${{ inputs.operation == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_BUILDER" == "ALL" ]]; then
            python3 -I engineering/scripts/control_plane.py host-preflight
          else
            python3 -I engineering/scripts/control_plane.py host-preflight --builder-id "$PREFLIGHT_BUILDER"
          fi

      - name: Validate dispatch input
        if: ${{ inputs.operation == 'dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "issue_number must be a positive integer" >&2
            exit 2
          fi
          if [[ -n "$EXPECTED_ATTEMPT_ID" && ! "$EXPECTED_ATTEMPT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "expected_attempt_id must be empty or a positive integer" >&2
            exit 2
          fi

      - name: Prepare serialized dispatch
        id: prepare
        if: ${{ inputs.operation == 'dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: >-
          python3 -I engineering/scripts/control_plane.py prepare-dispatch
          --issue-number "$ISSUE_NUMBER"
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"

      - name: Launch through protected host admission
        if: ${{ inputs.operation == 'dispatch' && steps.prepare.outputs.launch_required == 'true' }}
        run: >-
          python3 -I engineering/scripts/control_plane.py launch-dispatch
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Finalize exact launch state
        if: ${{ always() && inputs.operation == 'dispatch' && steps.prepare.outputs.launch_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
          LAUNCH_REQUEST_ID: ${{ steps.prepare.outputs.launch_request_id }}
        run: >-
          python3 -I engineering/scripts/control_plane.py finalize-dispatch
          --issue-number "$ISSUE_NUMBER"
          --launch-request-id "$LAUNCH_REQUEST_ID"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Validate program input
        if: ${{ contains(fromJSON('["start","review","reap","merge-check","merge","astra-audit","astra-consult","quota-readiness","quota-resume"]'), inputs.operation) }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "issue_number must be a positive integer for ${{ inputs.operation }}" >&2
            exit 2
          fi

      - name: Program lane board
        if: ${{ inputs.operation == 'lanes' }}
        run: python3 -I engineering/scripts/control_plane_program.py lanes

      - name: Program materialize
        if: ${{ inputs.operation == 'materialize' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py materialize --args-json "$PROGRAM_ARGS"

      - name: Program start (prepare writer)
        id: pstart
        if: ${{ inputs.operation == 'start' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: >-
          python3 -I engineering/scripts/control_plane_program.py start
          --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"

      - name: Program review (prepare reviewer)
        id: preview
        if: ${{ inputs.operation == 'review' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: >-
          python3 -I engineering/scripts/control_plane_program.py review
          --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"

      - name: Launch program session through protected host admission
        if: ${{ (inputs.operation == 'start' && steps.pstart.outputs.launch_required == 'true') || (inputs.operation == 'review' && steps.preview.outputs.launch_required == 'true') }}
        run: >-
          python3 -I engineering/scripts/control_plane.py launch-dispatch
          --packet "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-packet.json"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Finalize program writer launch
        if: ${{ always() && inputs.operation == 'start' && steps.pstart.outputs.launch_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
          LAUNCH_REQUEST_ID: ${{ steps.pstart.outputs.launch_request_id }}
        run: >-
          python3 -I engineering/scripts/control_plane.py finalize-dispatch
          --issue-number "$ISSUE_NUMBER"
          --launch-request-id "$LAUNCH_REQUEST_ID"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Finalize program reviewer launch
        if: ${{ always() && inputs.operation == 'review' && steps.preview.outputs.launch_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
          LAUNCH_REQUEST_ID: ${{ steps.preview.outputs.launch_request_id }}
        run: >-
          python3 -I engineering/scripts/control_plane_program.py finalize-review
          --issue-number "$ISSUE_NUMBER"
          --launch-request-id "$LAUNCH_REQUEST_ID"
          --result "$RUNNER_TEMP/astra-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-result.json"

      - name: Program reap (verified release)
        if: ${{ inputs.operation == 'reap' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py reap --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program merge readiness (computed, no merge)
        if: ${{ inputs.operation == 'merge-check' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py merge-check --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program merge (User decision M1; only a computed READY_FOR_MERGE, pinned to its head)
        if: ${{ inputs.operation == 'merge' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py merge --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program Astra audit (protected exact-head scope receipt)
        if: ${{ inputs.operation == 'astra-audit' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py astra-audit --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program Astra consultation (protected canonical decision request)
        if: ${{ inputs.operation == 'astra-consult' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py astra-consult --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program quota readiness (protected evidence only)
        if: ${{ inputs.operation == 'quota-readiness' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py quota-readiness --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Program quota resume (one fresh preflight and linked attempt)
        if: ${{ inputs.operation == 'quota-resume' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRA_CONTROL_GITHUB_TOKEN }}
        run: python3 -I engineering/scripts/control_plane_program.py quota-resume --issue-number "$ISSUE_NUMBER" --args-json "$PROGRAM_ARGS"

      - name: Wake the coordinator (best effort, never changes the outcome)
        if: ${{ always() && contains(fromJSON('["materialize","start","review","reap","merge","astra-audit","astra-consult","quota-resume"]'), inputs.operation) }}
        continue-on-error: true
        env:
          ROUTINE_TOKEN: ${{ secrets.ASTRA_COORDINATOR_ROUTINE_TOKEN }}
          ROUTINE_ID: ${{ vars.ASTRA_COORDINATOR_ROUTINE_ID }}
          OP: ${{ inputs.operation }}
        shell: bash
        # The token stays in the environment: never in a process argument (/proc/<pid>/cmdline).
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request
          token, routine = os.environ.get("ROUTINE_TOKEN", ""), os.environ.get("ROUTINE_ID", "")
          if not token or not re.fullmatch(r"trig_[A-Za-z0-9]+", routine):
              print("coordinator wake not configured")
              raise SystemExit(0)
          text = json.dumps({"event": "control-plane-run", "operation": os.environ["OP"],
                             "target": os.environ.get("ASTRA_TARGET_REPOSITORY", ""),
                             "issue": os.environ.get("ISSUE_NUMBER", ""), "run_id": os.environ["GITHUB_RUN_ID"]})
          request = urllib.request.Request(
              f"https://api.anthropic.com/v1/claude_code/routines/{routine}/fire",
              data=json.dumps({"text": text}).encode(), method="POST",
              headers={"Authorization": f"Bearer {token}", "anthropic-beta": "experimental-cc-routine-2026-04-01",
                       "anthropic-version": "2023-06-01", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"coordinator wake HTTP {response.status}")
          except Exception as exc:  # best effort: the hourly heartbeat covers a lost wake
              print(f"coordinator wake failed: {type(exc).__name__}")
          PY

