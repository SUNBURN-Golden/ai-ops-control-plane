name: Engineering source CI
on:
  pull_request:
    paths:
      - 'engineering/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/*.yml'
      - 'bots/**'
      - 'routines/**'
      - 'schemas/**'
      - 'workflows/**'
      - 'knowledge/**'
      - 'skills/**'
      - 'docs/**'
      - 'audits/**'
      - '*.md'
  push:
    branches: [main, ops/cp-extract-001]
    paths:
      - 'engineering/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/*.yml'
      - 'bots/**'
      - 'routines/**'
      - 'schemas/**'
      - 'workflows/**'
      - 'knowledge/**'
      - 'skills/**'
      - 'docs/**'
      - 'audits/**'
      - '*.md'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRA_TARGET_REPOSITORY: SUNBURN-Golden/kix-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2 pyte==0.8.2 wcwidth==0.9.1 cryptography==46.0.0 cffi==2.0.0 pycparser==3.0
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s engineering/scripts -p 'test_control_plane*.py'
      - run: bash -n engineering/scripts/control_plane_boundary_hook.sh && bash -n engineering/scripts/control_plane_boundary_probe.sh
      - name: Validate every central target profile
        shell: bash
        run: |
          set -euo pipefail
          # Assign first so a failing loader stops the step (set -e ignores $(...) inside for).
          targets=$(python3 -c 'import json; print(" ".join(json.load(open("engineering/.github/control-plane/projects.json"))))')
          [[ -n "$targets" ]]
          for target in $targets; do
            ASTRA_TARGET_REPOSITORY="$target" python3 engineering/scripts/control_plane.py validate-repo
          done
