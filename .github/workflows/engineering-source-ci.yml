name: Engineering source CI
on:
  pull_request:
    paths: ['engineering/**', 'tools/**', 'tests/**', '.github/workflows/engineering-source-ci.yml']
  push:
    branches: [main, ops/cp-extract-001]
    paths: ['engineering/**', 'tools/**', 'tests/**', '.github/workflows/engineering-source-ci.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRA_TARGET_REPOSITORY: BeautifulMind-JT/kix-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s engineering/scripts -p 'test_control_plane*.py'
      - run: bash -n engineering/scripts/control_plane_boundary_hook.sh && bash -n engineering/scripts/control_plane_boundary_probe.sh
      - run: python3 engineering/scripts/control_plane.py validate-repo
